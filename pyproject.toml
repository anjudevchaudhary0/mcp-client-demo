[project]
name = "mcp-client-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kumardevsingh", email = "kumardevsingh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "langchain>=1.4.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[project.scripts]
mcp-client-demo = "mcp_client_demo:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
